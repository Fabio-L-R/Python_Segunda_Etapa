{% extends 'base.html' %}
{% block title %}Nova tarefa{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm mt-2">
      <div class="card-body p-4">
        <h3 class="card-title mb-4"><i class="bi bi-plus-circle"></i> Nova tarefa</h3>
        <form method="POST" novalidate>
          <div class="mb-3">
            <label for="titulo" class="form-label">Título</label>
            <input type="text" class="form-control" id="titulo" name="titulo" required maxlength="120" autofocus>
          </div>
          <div class="mb-3">
            <label for="descricao" class="form-label">Descrição</label>
            <textarea class="form-control" id="descricao" name="descricao" rows="4" maxlength="1000"></textarea>
          </div>
          <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select class="form-select" id="status" name="status">
              {% for s in status_validos %}
              <option value="{{ s }}" {% if s == 'pendente' %}selected{% endif %}>{{ status_labels[s] }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
