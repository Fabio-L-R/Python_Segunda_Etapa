{% extends 'base.html' %}
{% block title %}Cadastro - Painel de Tarefas{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm mt-4">
      <div class="card-body p-4">
        <h3 class="card-title mb-4 text-center"><i class="bi bi-person-plus"></i> Criar conta</h3>
        <form method="POST" novalidate>
          <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="nome" name="nome" required autofocus>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>
          <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <input type="password" class="form-control" id="senha" name="senha" minlength="6" required>
            <div class="form-text">Mínimo de 6 caracteres.</div>
          </div>
          <div class="mb-3">
            <label for="confirmar_senha" class="form-label">Confirmar senha</label>
            <input type="password" class="form-control" id="confirmar_senha" name="confirmar_senha" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-person-check"></i> Cadastrar
          </button>
        </form>
        <p class="text-center mt-3 mb-0">
          Já tem conta? <a href="{{ url_for('login') }}">Entrar</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
